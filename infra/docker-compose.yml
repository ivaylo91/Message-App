services:
  postgres:
    image: postgres:16-alpine
    container_name: message-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: messageapp
      POSTGRES_PASSWORD: messageapp
      POSTGRES_DB: messageapp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: message-app-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # MQTT broker for real-time message transport to/from mobile clients.
  emqx:
    image: emqx/emqx:5.8
    container_name: message-app-emqx
    restart: unless-stopped
    ports:
      - "1883:1883" # MQTT
      - "8083:8083" # MQTT over WebSocket
      - "18083:18083" # Dashboard (admin/public by default)
    volumes:
      - emqx-data:/opt/emqx/data

  # Event streaming for delivery guarantees / fan-out at scale.
  # Not required to build the core chat flow — bring up when wiring
  # multi-device fan-out or audit logging.
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: message-app-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    profiles: ["kafka"]

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: message-app-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    profiles: ["kafka"]

volumes:
  postgres-data:
  redis-data:
  emqx-data:
